<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starbucks Header</title>
    <link rel="stylesheet" href="style/styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <!-- Logo -->
            <div class="logo">
                <img src="images/Starbucks_Corporation_Logo_2011.svg.png" alt="Starbucks">
            </div>

            <!-- Navigation Links -->
            <ul class="nav-links">
                <li><a href="#">Menu</a></li>
                <li><a href="#">Rewards</a></li>
                <li><a href="#">Gift Cards</a></li>
            </ul>

            <!-- Right Section: Store Locator, Sign In, Join Now -->
            <div class="nav-right">
                <div class="store-locator">
                    <a href="#">Find a store</a>
                </div>
                <button class="sign-in">Sign in</button>
                <button class="join-now">Join now</button>
            </div>
        </nav>
    </header>
</body>
</html>
